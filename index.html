<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日三合一 · 工作 / 学习 / 训练</title>
<style>
:root {
  --bg: #f5f5f7; --card: #ffffff; --border: #e0e0e0;
  --text: #1a1a1a; --muted: #999; --sub: #555;
  --accent: #4a7eff; --green: #22c55e; --orange: #f59e0b; --red: #ef4444;
  --purple: #8b5cf6; --pink: #ec4899; --cyan: #06b6d4;
  --radius: 14px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'SF Pro', 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.header { text-align: center; padding: 28px 16px 12px; }
.header h1 { font-size: 1.6rem; font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--purple), var(--pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.date-bar { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 10px 0 20px; }
.date-bar button { background: var(--card); border: 1px solid var(--border); color: var(--text); width: 34px; height: 34px; border-radius: 10px; cursor: pointer; font-size: 1.1rem; transition: all .2s; }
.date-bar button:hover { border-color: var(--accent); color: var(--accent); }
.date-bar .date-text { font-size: 1rem; font-weight: 700; min-width: 140px; text-align: center; }
.date-bar .today-btn { font-size: 0.75rem; padding: 4px 12px; border-radius: 8px; background: var(--accent); color: #fff; border: none; cursor: pointer; font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; max-width: 1400px; margin: 0 auto; padding: 0 16px 30px; }
@media (max-width: 1024px) { .grid { grid-template-columns: 1fr; max-width: 600px; } }
.module { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; }
.module-header { padding: 16px 18px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.module-header .icon { font-size: 1.3rem; }
.module-header h2 { font-size: 1rem; font-weight: 700; }
.module-header .badge { margin-left: auto; font-size: 0.7rem; padding: 2px 10px; border-radius: 10px; font-weight: 600; }
.badge-work { background: rgba(74,126,255,.12); color: var(--accent); }
.badge-learn { background: rgba(139,92,246,.12); color: var(--purple); }
.badge-train { background: rgba(236,72,153,.12); color: var(--pink); }
.module-body { padding: 16px 18px; flex: 1; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; max-height: 85vh; }
.module-body::-webkit-scrollbar { width: 4px; }
.module-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px; color: var(--text); font-size: 0.88rem; resize: vertical; min-height: 50px; outline: none; font-family: inherit; line-height: 1.6; transition: border-color .2s; }
textarea:focus { border-color: var(--accent); }
textarea::placeholder { color: var(--muted); }
.input-section { background: var(--bg); border-radius: 10px; padding: 12px; }
.input-section-label { font-size: 0.75rem; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
.btn-row { display: flex; gap: 8px; justify-content: flex-end; }
.btn { padding: 7px 18px; border-radius: 8px; border: none; cursor: pointer; font-size: 0.82rem; font-weight: 600; transition: all .2s; }
.btn:hover { opacity: .85; }
.btn-blue { background: var(--accent); color: #fff; }
.btn-purple { background: var(--purple); color: #fff; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--sub); }
.btn-outline:hover { border-color: var(--accent); color: var(--accent); }
.priority-row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
.priority-btn { padding: 4px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); cursor: pointer; font-size: 0.75rem; font-weight: 600; transition: all .2s; }
.priority-btn.sel { border-color: transparent; color: #fff; }
.priority-btn.sel-p0 { background: var(--red); }
.priority-btn.sel-p1 { background: var(--orange); }
.priority-btn.sel-p2 { background: var(--green); }
.task-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
.task-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; background: var(--bg); border-radius: 10px; }
.task-item.done { opacity: .5; }
.task-cb { width: 20px; height: 20px; min-width: 20px; border-radius: 50%; border: 2px solid var(--accent); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .2s; margin-top: 2px; flex-shrink: 0; }
.task-cb:hover { background: rgba(74,126,255,.1); }
.task-cb.checked { border-color: var(--green); background: var(--green); }
.task-cb.checked::after { content: '\2713'; color: #fff; font-size: 11px; font-weight: 700; }
.task-item.done .task-text { text-decoration: line-through; color: var(--muted); }
.task-text { flex: 1; font-size: 0.85rem; line-height: 1.5; }
.task-priority { font-size: 0.68rem; padding: 2px 8px; border-radius: 6px; font-weight: 700; flex-shrink: 0; margin-top: 2px; }
.tp-p0 { background: rgba(239,68,68,.12); color: var(--red); }
.tp-p1 { background: rgba(245,158,11,.12); color: var(--orange); }
.tp-p2 { background: rgba(34,197,94,.12); color: var(--green); }
.task-time { font-size: 0.68rem; color: var(--muted); margin-top: 2px; }
.task-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.75rem; opacity: 0; transition: opacity .2s; flex-shrink: 0; }
.task-item:hover .task-del { opacity: 1; }
.task-del:hover { color: var(--red); }
.progress-wrap { margin-bottom: 4px; }
.progress-info { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
.progress-bar { background: var(--border); border-radius: 6px; height: 5px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 6px; transition: width .4s; background: linear-gradient(90deg, var(--accent), var(--cyan)); }
.section-label { font-size: 0.75rem; color: var(--muted); font-weight: 600; padding-bottom: 4px; }
.notes-box textarea { min-height: 36px; background: var(--bg); }
.today-learned { background: linear-gradient(135deg, rgba(139,92,246,.06), rgba(236,72,153,.06)); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.today-learned h4 { font-size: 0.8rem; color: var(--purple); margin-bottom: 6px; font-weight: 700; }
.today-learned .tl-content { font-size: 0.88rem; line-height: 1.6; color: var(--sub); }
.knowledge-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; background: var(--bg); border-radius: 10px; }
.review-tag { font-size: 0.65rem; padding: 2px 8px; border-radius: 6px; background: rgba(245,158,11,.12); color: var(--orange); font-weight: 600; cursor: pointer; flex-shrink: 0; margin-top: 2px; user-select: none; }
.review-tag.active { background: var(--orange); color: #fff; }
.train-goal { background: linear-gradient(135deg, rgba(236,72,153,.06), rgba(139,92,246,.06)); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; font-size: 0.82rem; color: var(--sub); line-height: 1.6; }
.train-goal strong { color: var(--pink); }
.train-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.train-day { background: var(--bg); border-radius: 10px; padding: 8px 4px; text-align: center; font-size: 0.75rem; }
.train-day .td-label { font-weight: 700; color: var(--sub); margin-bottom: 2px; }
.train-day .td-type { font-size: 0.65rem; color: var(--muted); margin-bottom: 2px; }
.train-day .td-detail { font-size: 0.7rem; color: var(--sub); margin-bottom: 6px; font-weight: 600; }
.train-day .td-check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border); background: transparent; cursor: pointer; margin: 0 auto; display: flex; align-items: center; justify-content: center; transition: all .2s; }
.train-day .td-check:hover { border-color: var(--pink); }
.train-day .td-check.done { border-color: var(--green); background: var(--green); }
.train-day .td-check.done::after { content: '\2713'; color: #fff; font-size: 12px; font-weight: 700; }
.train-day.today { border: 2px solid var(--accent); }
.train-stats { display: flex; gap: 16px; font-size: 0.78rem; color: var(--sub); flex-wrap: wrap; }
.cardio-time { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; color: var(--sub); }
.cardio-time input { width: 60px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.82rem; text-align: center; outline: none; }
.cardio-time input:focus { border-color: var(--accent); }
.empty { text-align: center; padding: 24px; color: var(--muted); font-size: 0.82rem; }
</style>
</head>
<body>
<div class="header"><h1>📋 每日三合一</h1></div>
<div class="date-bar">
  <button onclick="changeDate(-1)">‹</button>
  <span class="date-text" id="dateLabel"></span>
  <button onclick="changeDate(1)">›</button>
  <button class="today-btn" onclick="goToday()">今天</button>
</div>
<div class="grid">
  <!-- 工作 -->
  <div class="module">
    <div class="module-header"><span class="icon">💼</span><h2>工作</h2><span class="badge badge-work" id="workBadge">0 项</span></div>
    <div class="module-body">
      <div class="input-section">
        <div class="input-section-label">📌 添加待办事项</div>
        <div class="priority-row">
          <span style="font-size:0.75rem;color:var(--muted)">优先级：</span>
          <button class="priority-btn sel sel-p0" id="pBtn0" onclick="setPriority(0)">🔴 P0</button>
          <button class="priority-btn" id="pBtn1" onclick="setPriority(1)">🟡 P1</button>
          <button class="priority-btn" id="pBtn2" onclick="setPriority(2)">🟢 P2</button>
        </div>
        <textarea id="workTodoInput" placeholder="输入待办事项，每行一项" rows="2"></textarea>
        <div class="btn-row" style="margin-top:8px"><button class="btn btn-blue" onclick="addWorkTodo()">添加</button></div>
      </div>
      <div id="workProgress"></div>
      <div id="workList"></div>
      <div>
        <div class="section-label">📝 备注</div>
        <textarea class="notes-box" id="workNotes" placeholder="记录关键内容..." rows="2" oninput="saveNotes()"></textarea>
      </div>
    </div>
  </div>
  <!-- 学习 -->
  <div class="module">
    <div class="module-header"><span class="icon">📚</span><h2>学习</h2><span class="badge badge-learn" id="learnBadge">0 条</span></div>
    <div class="module-body">
      <div class="input-section">
        <div class="input-section-label">💡 今日所学一句话</div>
        <textarea id="todayLearnedInput" placeholder="用1-2句话总结今天学到了什么" rows="2"></textarea>
        <div class="btn-row" style="margin-top:8px"><button class="btn btn-purple" onclick="saveTodayLearned()">保存</button></div>
      </div>
      <div id="todayLearnedDisplay"></div>
      <div class="input-section">
        <div class="input-section-label">📖 新增知识点</div>
        <textarea id="knowledgeInput" placeholder="输入知识点，每行一项" rows="2"></textarea>
        <div class="btn-row" style="margin-top:8px"><button class="btn btn-outline" onclick="addKnowledge()">添加</button></div>
      </div>
      <div id="knowledgeList"></div>
    </div>
  </div>
  <!-- 训练 -->
  <div class="module">
    <div class="module-header"><span class="icon">💪</span><h2>训练</h2><span class="badge badge-train" id="trainBadge">本周进度</span></div>
    <div class="module-body">
      <div class="train-goal"><strong>🎯 每周目标：</strong>至少 3 次有氧（跑步）+ 4 次无氧（胸/肩膀/背部/腿）</div>
      <div id="trainStats" class="train-stats"></div>
      <div class="section-label">📅 本周训练计划</div>
      <div class="train-week" id="trainWeek"></div>
      <div class="cardio-time">
        <span>🏃 今日跑步：</span>
        <input type="number" id="cardioMinutes" placeholder="0" min="0" onchange="saveCardioTime()">
        <span>分钟</span>
      </div>
    </div>
  </div>
</div>

<script>
function load(key){return JSON.parse(localStorage.getItem(key)||'{}');}
function save(key,d){localStorage.setItem(key,JSON.stringify(d));}
function loadArr(key){return JSON.parse(localStorage.getItem(key)||'[]');}
function saveArr(key,d){localStorage.setItem(key,JSON.stringify(d));}

let curDate=new Date();
const weekdays=['周日','周一','周二','周三','周四','周五','周六'];
function ds(d){return d.toISOString().split('T')[0];}
function fmtDate(d){
  const m=d.getMonth()+1,day=d.getDate(),w=weekdays[d.getDay()];
  const today=ds(new Date()),s=ds(d);
  const prefix=s===today?'今天 · ':'';
  return `${prefix}${m}.${day} ${w}`;
}
function changeDate(delta){curDate=new Date(curDate.getTime()+delta*864e5);render();}
function goToday(){curDate=new Date();render();}
function nowTime(){return new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});}
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ── Work ──
let curPriority=0;
function setPriority(p){
  curPriority=p;
  [0,1,2].forEach(i=>{
    const b=document.getElementById('pBtn'+i);
    b.className=i===p?'priority-btn sel sel-p'+i:'priority-btn';
  });
}
function addWorkTodo(){
  const el=document.getElementById('workTodoInput'),text=el.value.trim();if(!text)return;
  const todos=loadArr('hub_todos'),dateStr=ds(curDate),time=nowTime();
  text.split('\n').map(l=>l.trim()).filter(Boolean).forEach((line,i)=>{
    todos.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5)+i,content:line.replace(/^[-·•]\s*/,''),priority:curPriority,done:false,date:dateStr,time});
  });
  saveArr('hub_todos',todos);el.value='';render();
}
function toggleTodo(id){
  const todos=loadArr('hub_todos'),t=todos.find(x=>x.id===id);
  if(t){t.done=!t.done;t.doneTime=t.done?nowTime():null;saveArr('hub_todos',todos);render();}
}
function delTodo(id){saveArr('hub_todos',loadArr('hub_todos').filter(x=>x.id!==id));render();}
function saveNotes(){const n=load('hub_notes');n[ds(curDate)]=document.getElementById('workNotes').value;save('hub_notes',n);}

// ── Learning ──
function saveTodayLearned(){
  const el=document.getElementById('todayLearnedInput'),text=el.value.trim();if(!text)return;
  const d=load('hub_today_learned');d[ds(curDate)]=text;save('hub_today_learned',d);el.value='';render();
}
function addKnowledge(){
  const el=document.getElementById('knowledgeInput'),text=el.value.trim();if(!text)return;
  const items=loadArr('hub_knowledge'),dateStr=ds(curDate);
  text.split('\n').map(l=>l.trim()).filter(Boolean).forEach((line,i)=>{
    items.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5)+i,content:line.replace(/^[-·•\d.、]\s*/,''),needReview:false,date:dateStr});
  });
  saveArr('hub_knowledge',items);el.value='';render();
}
function toggleReview(id){
  const items=loadArr('hub_knowledge'),item=items.find(x=>x.id===id);
  if(item){item.needReview=!item.needReview;saveArr('hub_knowledge',items);render();}
}
function delKnowledge(id){saveArr('hub_knowledge',loadArr('hub_knowledge').filter(x=>x.id!==id));render();}

// ── Training ──
const TRAIN_PLAN=[
  {day:'周一',type:'无氧',label:'胸'},
  {day:'周二',type:'无氧',label:'肩膀'},
  {day:'周三',type:'有氧',label:'跑步'},
  {day:'周四',type:'无氧',label:'背部'},
  {day:'周五',type:'无氧',label:'腿'},
  {day:'周六',type:'有氧',label:'跑步'},
  {day:'周日',type:'有氧',label:'跑步'},
];

function getWeekDates(){
  const d=new Date(curDate),dow=d.getDay()||7;
  const mon=new Date(d);mon.setDate(d.getDate()-(dow-1));
  const dates=[];
  for(let i=0;i<7;i++){const x=new Date(mon);x.setDate(mon.getDate()+i);dates.push(ds(x));}
  return dates;
}
function toggleTrainDay(dateStr){
  const d=load('hub_train_week');
  if(d[dateStr])delete d[dateStr];else d[dateStr]={done:true,time:nowTime()};
  save('hub_train_week',d);render();
}
function saveCardioTime(){
  const m=document.getElementById('cardioMinutes').value;
  const d=load('hub_cardio_time');d[ds(curDate)]=parseInt(m)||0;save('hub_cardio_time',d);
}

// ── Render ──
function render(){
  document.getElementById('dateLabel').textContent=fmtDate(curDate);
  const dateStr=ds(curDate);

  // Work
  const todos=loadArr('hub_todos').filter(e=>e.date===dateStr);
  todos.sort((a,b)=>{if(a.done!==b.done)return a.done?1:-1;return a.priority-b.priority;});
  const done=todos.filter(e=>e.done),undone=todos.filter(e=>!e.done);
  document.getElementById('workBadge').textContent=`${todos.length} 项`;
  let w='';
  if(todos.length){
    const pct=Math.round(done.length/todos.length*100);
    w+=`<div class="progress-wrap"><div class="progress-info"><span>完成进度</span><span>${done.length}/${todos.length} (${pct}%)</span></div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div></div>`;
  }
  if(undone.length){
    w+=`<div class="section-label">📌 待办（${undone.length}）</div><ul class="task-list">`;
    undone.forEach(e=>{
      const pL=['🔴P0','🟡P1','🟢P2'][e.priority],pC='tp-p'+e.priority;
      w+=`<li class="task-item"><button class="task-cb" onclick="toggleTodo('${e.id}')"></button><div style="flex:1"><span class="task-text">${esc(e.content)}</span><div class="task-time">${e.time}</div></div><span class="task-priority ${pC}">${pL}</span><button class="task-del" onclick="delTodo('${e.id}')">✕</button></li>`;
    });
    w+='</ul>';
  }
  if(done.length){
    w+=`<div class="section-label">✅ 已完成（${done.length}）</div><ul class="task-list">`;
    done.forEach(e=>{
      w+=`<li class="task-item done"><button class="task-cb checked" onclick="toggleTodo('${e.id}')"></button><div style="flex:1"><span class="task-text">${esc(e.content)}</span><div class="task-time">${e.doneTime||e.time}</div></div><button class="task-del" onclick="delTodo('${e.id}')">✕</button></li>`;
    });
    w+='</ul>';
  }
  if(!todos.length) w='<div class="empty">暂无待办，添加今日工作 ✍️</div>';
  document.getElementById('workList').innerHTML=w;
  document.getElementById('workProgress').innerHTML='';
  document.getElementById('workNotes').value=load('hub_notes')[dateStr]||'';

  // Learning
  const tl=load('hub_today_learned')[dateStr];
  document.getElementById('todayLearnedDisplay').innerHTML=tl?`<div class="today-learned"><h4>💡 今日所学</h4><div class="tl-content">${esc(tl)}</div></div>`:'';
  const knowledge=loadArr('hub_knowledge').filter(e=>e.date===dateStr);
  document.getElementById('learnBadge').textContent=`${knowledge.length} 条`;
  let k='';
  if(knowledge.length){
    k+='<ul class="task-list">';
    knowledge.forEach(e=>{
      const rc=e.needReview?'review-tag active':'review-tag';
      k+=`<li class="knowledge-item"><span class="task-text">${esc(e.content)}</span><span class="${rc}" onclick="toggleReview('${e.id}')">${e.needReview?'📌需复习':'标记复习'}</span><button class="task-del" onclick="delKnowledge('${e.id}')">✕</button></li>`;
    });
    k+='</ul>';
    const reviewItems=knowledge.filter(e=>e.needReview);
    if(reviewItems.length) k+=`<div class="section-label" style="margin-top:8px;color:var(--orange)">⚠️ 需复习：${reviewItems.length} 项</div>`;
  }
  document.getElementById('knowledgeList').innerHTML=k;

  // Training
  const weekDates=getWeekDates();
  const trainData=load('hub_train_week');
  const cardioData=load('hub_cardio_time');
  const todayStr=ds(new Date());
  let t='';
  let cardioCount=0,strengthCount=0;
  weekDates.forEach((dt,i)=>{
    const plan=TRAIN_PLAN[i];
    const isDone=!!trainData[dt];
    if(isDone){if(plan.type==='有氧')cardioCount++;else strengthCount++;}
    const isToday=dt===todayStr?'today':'';
    t+=`<div class="train-day ${isToday}"><div class="td-label">${plan.day}</div><div class="td-type">${plan.type}</div><div class="td-detail">${plan.label}</div><div class="td-check ${isDone?'done':''}" onclick="toggleTrainDay('${dt}')"></div></div>`;
  });
  document.getElementById('trainWeek').innerHTML=t;
  document.getElementById('trainBadge').textContent=`${cardioCount+strengthCount}/7`;
  document.getElementById('trainStats').innerHTML=`<span>🫀 有氧 ${cardioCount}/3</span><span>🏋️ 无氧 ${strengthCount}/4</span>`;
  document.getElementById('cardioMinutes').value=cardioData[dateStr]||'';
}

// Keyboard shortcuts
document.getElementById('workTodoInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();addWorkTodo();}});
document.getElementById('todayLearnedInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();saveTodayLearned();}});
document.getElementById('knowledgeInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();addKnowledge();}});

render();
</script>
</body>
</html>
